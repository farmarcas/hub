# Produção (Coolify): imagens finais, sem código montado e sem portas publicadas.
# O domínio e o HTTPS ficam no Coolify, apontando para o serviço `web` na porta 8080.
# Para desenvolvimento local use o docker-compose.yml.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER nas variáveis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD nas variáveis}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB nas variáveis}
      # UTF8 só vale na primeira criação do volume (database/DATABASE.md).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Roda uma vez por publicação, antes da API. Se falhar, a API nova não sobe.
  migrate:
    build:
      context: ./backend/node
      target: runtime
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend/node
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      AUTH_MODE: ${AUTH_MODE:-mock}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./frontend/react
      target: runtime
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:4000
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
